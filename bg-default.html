<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
  #default-bg{display:block;width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<script src="js/theme-state.js?v=9"></script>
<script>
// Host page for the default background. data/bg-default.json names a full-bleed image (and accent)
// for each day of the year, 1-365, plus a `default` fallback; today's entry picks the image.
(function () {
  'use strict';

  function show(src) {
    if (!src) return;
    var img = document.createElement('img');
    img.id = 'default-bg';
    img.alt = '';
    img.decoding = 'async';
    // Missing art just leaves the plain black page rather than a broken image icon.
    img.addEventListener('error', function () { img.remove(); });
    img.src = src;
    document.body.appendChild(img);
  }

  // ?date=YYYY-MM-DD lets the date-simulation harness pin the day this page renders.
  function pinnedDate() {
    var raw = new URLSearchParams(location.search).get('date');
    if (!raw) return undefined;
    var d = new Date(raw + 'T12:00:00');
    return isNaN(d.getTime()) ? undefined : d;
  }

  if (!window.BrowserThemeState || !BrowserThemeState.loadDefaultBackgroundConfig) return;

  BrowserThemeState.loadDefaultBackgroundConfig().then(function (cfg) {
    show(BrowserThemeState.resolveDailyBackground(cfg, pinnedDate()).image);
  });
})();
</script>
</body>
</html>
